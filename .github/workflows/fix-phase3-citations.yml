name: Normalize Phase 3 citation markers

on:
  push:
    paths:
      - 'cases/001-ai-coding-agent-landscape/03-ranking-methodology.md'
      - 'cases/001-ai-coding-agent-landscape/03-top10-selection.md'
      - '.github/workflows/fix-phase3-citations.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace internal citation markers
        shell: python
        run: |
          from pathlib import Path
          import re

          replacements = {
              'turn445595search0': '[^market1]',
              'turn819036search1': '[^market3]',
              'turn543612search0': '[^qoder]',
              'turn543612search1': '[^qoder]',
              'turn543612search4': '[^trae]',
              'turn543612search2': '[^trae]',
              'turn445595news117': '[^cursor]',
              'turn612798search3': '[^cursor]',
              'turn445595search3': '[^qdev]',
              'turn445595search5': '[^qdev]',
              'turn445595search1': '[^antigravity]',
              'turn445595search8': '[^antigravity]',
              'turn445595search9': '[^antigravity]',
              'turn875248search0': '[^benchmark]',
              'turn875248search11': '[^benchmark]',
          }

          files = [
              Path('cases/001-ai-coding-agent-landscape/03-ranking-methodology.md'),
              Path('cases/001-ai-coding-agent-landscape/03-top10-selection.md'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')

              def replace_cite(match):
                  refs = match.group(1)
                  found = []
                  for ref in refs.split(''):
                      if ref in replacements:
                          token = replacements[ref]
                          if token not in found:
                              found.append(token)
                  if not found:
                      return ''
                  return ''.join(found)

              text = re.sub(r'cite([^]+)', replace_cite, text)
              text = re.sub(r'fileciteturn10file0', '[^phase2]', text)
              text = re.sub(r'fileciteturn16file0', '[^phase1]', text)
              text = re.sub(r'fileciteturn9file0', '[^phase1]', text)

              # Remove any remaining internal citation wrapper as a safety net,
              # while preserving its readable source reference when possible.
              text = re.sub(r'(?:cite|filecite)[^]*', '', text)

              footnotes = {
                  '[^market1]': '[^market1]: JetBrains, “AI Coding Agents: Adoption Trends”, August 2026. Independent professional-developer survey; figures are adoption signals, not global market share.',
                  '[^market3]': '[^market3]: Anthropic, “How AI is changing software development”, June 2026. Proprietary Claude Code usage research; not a market-wide census.',
                  '[^qoder]': '[^qoder]: Qoder official product/changelog materials, August 2026. Vendor product and scale evidence.',
                  '[^trae]': '[^trae]: TRAE official product / TRAE Work materials, 2026. Vendor product and scale evidence.',
                  '[^cursor]': '[^cursor]: Cursor product documentation and Reuters reporting, August 2026, for product and strategic-status context.',
                  '[^qdev]': '[^qdev]: AWS documentation on Amazon Q Developer → Kiro migration and Q Developer IDE plugin end of support.',
                  '[^antigravity]': '[^antigravity]: Google Antigravity documentation and Gemini CLI → Antigravity CLI migration materials, 2026.',
                  '[^benchmark]': '[^benchmark]: SWE-bench public benchmark ecosystem and 2026 agent comparison references; benchmark results are supporting evidence only.',
                  '[^phase1]': '[^phase1]: Phase 1 evidence base: `01-candidate-universe.md`.',
                  '[^phase2]': '[^phase2]: Phase 2 evidence base: `02-market-evidence.md`.',
              }

              needed = [k for k in footnotes if k in text]
              definitions = '\n'.join(footnotes[k] for k in needed)
              if definitions and not definitions.endswith('\n'):
                  definitions += '\n'
              if definitions:
                  text = text.rstrip() + '\n\n' + definitions

              path.write_text(text, encoding='utf-8')

      - name: Commit normalized files and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases/001-ai-coding-agent-landscape/03-ranking-methodology.md cases/001-ai-coding-agent-landscape/03-top10-selection.md .github/workflows/fix-phase3-citations.yml
          git rm .github/workflows/fix-phase3-citations.yml
          git commit -m 'fix: normalize Phase 3 markdown citations'
          git push
