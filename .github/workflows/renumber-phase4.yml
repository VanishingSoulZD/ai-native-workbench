name: Renumber Phase 4 Product Files

on:
  push:
    paths:
      - ".github/workflows/renumber-phase4.yml"

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renumber product sections
        run: |
          set -euo pipefail
          for f in cases/001-ai-coding-agent-landscape/04-products/product-*.md; do
            perl -0pi -e 's/^## 9\.1 Product Identity$/## 1. Product Identity/m; s/^## 9\.2 Product Positioning$/## 2. Product Positioning/m; s/^## 9\.3 Product Architecture$/## 3. Product Architecture/m; s/^## 9\.4 Agent Loop$/## 4. Agent Loop/m; s/^## 9\.5 Workflow$/## 5. Workflow/m; s/^## 9\.6 Capability$/## 6. Capability/m; s/^## 9\.7 Economics$/## 7. Economics/m; s/^## 9\.8 Ecosystem$/## 8. Ecosystem/m; s/^## 9\.9 Unique Insight$/## 9. Unique Insight/m' "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/001-ai-coding-agent-landscape/04-products/product-*.md
          git commit -m "fix: renumber Phase 4 product sections"
          git push
